<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <defs>
    <linearGradient id="logo-obs-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ai-text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Obs_AI Icon Mark -->
  <g transform="translate(2, 2)">
    <rect width="40" height="40" rx="9" fill="#090D16" />
    <rect x="0.5" y="0.5" width="39" height="39" rx="8.5" stroke="#1E2330" />
    
    <!-- Lens contour -->
    <path d="M 7 20 C 12 11, 28 11, 33 20 C 28 29, 12 29, 7 20 Z" stroke="url(#logo-obs-grad)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Concentric ring -->
    <circle cx="20" cy="20" r="6.5" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="2.5 2" />
    
    <!-- Core & nodes -->
    <circle cx="20" cy="20" r="3.2" fill="url(#logo-obs-grad)" />
    <circle cx="20" cy="20" r="1.3" fill="#FFFFFF" />
    <circle cx="7" cy="20" r="1.8" fill="#6366F1" />
    <circle cx="33" cy="20" r="1.8" fill="#38BDF8" />
    <circle cx="20" cy="9" r="1.8" fill="#38BDF8" />
    <circle cx="20" cy="31" r="1.8" fill="#8B5CF6" />
  </g>

  <!-- Wordmark Text -->
  <text x="56" y="29" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">Obs_<tspan fill="url(#ai-text-grad)">AI</tspan></text>
</svg>
