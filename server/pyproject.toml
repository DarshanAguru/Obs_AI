[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-ai-server"
version = "0.1.1"
description = "Obs_AI Telemetry & Debugging Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
obs-ai-server = "obs_ai_server.main:start"
obs_ai_server = "obs_ai_server.main:start"
ai-obs-server = "obs_ai_server.main:start"
ai_obs_server = "obs_ai_server.main:start"

[tool.setuptools.packages.find]
where = ["."]
