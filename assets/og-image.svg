<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="1200" height="630" fill="#080B11" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1E293B" />
    </pattern>
    <linearGradient id="og-obs-grad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="600" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="og-ai-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-grid)" />
  <circle cx="600" cy="220" r="280" fill="url(#glow-grad)" filter="blur(40px)" />

  <!-- Obs_AI Icon (Centered, 140x140) -->
  <g transform="translate(530, 80)">
    <rect width="140" height="140" rx="32" fill="#090D16" stroke="#1E2330" stroke-width="2" />
    
    <!-- Lens Contour -->
    <path d="M 24 70 C 42 38, 98 38, 116 70 C 98 102, 42 102, 24 70 Z" stroke="url(#og-obs-grad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Aperture Ring -->
    <circle cx="70" cy="70" r="24" stroke="#818CF8" stroke-width="3" stroke-dasharray="7 5" />
    
    <!-- Neural Links -->
    <path d="M 70 34 L 70 46 M 70 94 L 70 106 M 46 46 L 60 60 M 94 46 L 80 60 M 46 94 L 60 80 M 94 94 L 80 80" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Nodes -->
    <circle cx="70" cy="28" r="6" fill="#38BDF8" />
    <circle cx="70" cy="112" r="6" fill="#8B5CF6" />
    <circle cx="24" cy="70" r="6" fill="#6366F1" />
    <circle cx="116" cy="70" r="6" fill="#38BDF8" />
    
    <!-- Core -->
    <circle cx="70" cy="70" r="11" fill="url(#og-obs-grad)" />
    <circle cx="70" cy="70" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="600" y="280" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Obs_<tspan fill="url(#og-ai-text)">AI</tspan></text>

  <!-- Tagline Pill -->
  <g transform="translate(435, 305)">
    <rect width="330" height="36" rx="18" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
    <circle cx="455" cy="323" r="4" fill="#38BDF8" />
    <text x="470" y="328" fill="#C7D2FE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">SELF-HOSTED AI OBSERVABILITY</text>
  </g>

  <!-- Description Subtext -->
  <text x="600" y="380" text-anchor="middle" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">
    Distributed Tracing, Token Analytics &amp; Execution Replay for LLMs, RAG &amp; Agents
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(180, 430)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="80" rx="12" fill="#0D111A" stroke="#1E2330" stroke-width="1" />
    <text x="24" y="35" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Zero Dependencies</text>
    <text x="24" y="58" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">Single 40MB container</text>

    <!-- Card 2 -->
    <rect x="290" y="0" width="260" height="80" rx="12" fill="#0D111A" stroke="#1E2330" stroke-width="1" />
    <text x="314" y="35" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Full Trace Causality</text>
    <text x="314" y="58" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">LLM + Vector + Tool trees</text>

    <!-- Card 3 -->
    <rect x="580" y="0" width="260" height="80" rx="12" fill="#0D111A" stroke="#1E2330" stroke-width="1" />
    <text x="604" y="35" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">100% Local &amp; Private</text>
    <text x="604" y="58" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">Self-hosted SQLite / PG</text>
  </g>

  <!-- Bottom Bar -->
  <text x="600" y="575" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="13">
    pip install obs-ai &bull; github.com/DarshanAguru/Obs_AI
  </text>
</svg>
