version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - OBS_AI_DATABASE_URL=postgresql://obs_ai:obs_ai_secret@postgres:5432/obs_ai_db
      - OBS_AI_REDIS_URL=redis://redis:6379/0
      - OBS_AI_LOG_LEVEL=INFO
      - OBS_AI_RETENTION_DAYS=30
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - OBS_AI_DATABASE_URL=postgresql://obs_ai:obs_ai_secret@postgres:5432/obs_ai_db
      - OBS_AI_REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obs_ai
      POSTGRES_PASSWORD: obs_ai_secret
      POSTGRES_DB: obs_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
